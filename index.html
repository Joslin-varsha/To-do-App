<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        #body{
            background-image: url(images/todo.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            padding-top: 50px;
            
        }
        #container{
            background-color: rgba(131, 202, 230, 0.4);
            color: rgb(27, 26, 26);
            text-shadow: 3px 3px 2px rgb(255, 249, 249);
            border-radius: 20px;
            border: 1px solid white;
        }
        #container:hover {
            transform: scale(1.03); 
        }
        #inp{
            border-radius: 20px;
            border: 1px solid rgb(250, 243, 243);
            width: 100%;
            max-width: 550px; 
            margin-left: 20px;
        }
        @media (max-width: 576px) {
            #inp {
                 margin-left: 1px; 
                }
            }
        .taskClr{
            background-color: #ffeffc;
            border: 2px dotted rgb(243, 162, 175);
        }
        .btnbor{
            border: 1px solid rgb(151, 149, 149);
        }
        #taskList{
            background-color: rgba(255, 253, 251, 0.5);
            border-radius: 10px;
        }
        #adBtn {
            border-radius: 15px; 
            margin-left: 10px;
        }
        @media (max-width: 576px) {
            #adBtn {
                 border-radius: 25px; 
                 margin-left: auto;
                 margin-right: auto;
                 margin-top: 10px;
                 width: 50%;
                }
            }
        
    </style>
</head>
<body id="body">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-sm-6" id="container">
                <h2 class="text-center p-3">TO DO - LIST APP</h2>
                <div class="d-flex flex-column flex-sm-row">
                        <input type="text" class="form-control" id="inp" placeholder="Enter a Task">
                        <button onclick="add()" class="btn bg-primary text-light" id="adBtn">Add Task</button>
                </div>
                <div id="taskList" class="mt-3"></div>
            </div>
        </div>
    </div>


    <script>
        function add(){
            let task=document.getElementById("inp").value;
            document.getElementById("inp").value=""
            if(task==""){
                alert("Please Enter a Task")
                taskDiv.remove()
            }

            let taskDiv=document.createElement("div")
            taskDiv.className="d-flex m-2 "

            let taskP=document.createElement("p")
            taskP.className = "ms-3 mt-2 w-100 me-3 p-2 ps-3 rounded-pill taskClr"
            taskP.textContent = task;

            let dltBtn = document.createElement("button")
            dltBtn.className = "btn btn-light px-2 py-0 m-2 btn-sm rounded-lg btnbor"
            dltBtn.textContent = "❌"
            dltBtn.onclick = function () {
            taskDiv.remove()
            };

            let upBtn = document.createElement("button")
            upBtn.className = "btn btn-secondary px-2 py-0 m-2  btn-sm rounded-lg btnbor"
            upBtn.textContent = "Update"

            taskDiv.appendChild(taskP)
            taskDiv.appendChild(dltBtn)
            taskDiv.appendChild(upBtn)

            document.getElementById("taskList").appendChild(taskDiv)
        }
      
      
    </script>
    

























    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
